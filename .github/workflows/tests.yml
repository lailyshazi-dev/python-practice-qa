name: QA tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          python -m pytest -m smoke \
            --html=reports/smoke-report.html \
            --self-contained-html \
            --junitxml=reports/smoke-junit.xml

      - name: Upload smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Regression tests
    needs: smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m pytest -m "not smoke and not ui" \
            --html=reports/regression-report.html \
            --self-contained-html \
            --junitxml=reports/regression-junit.xml

      - name: Upload regression artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  ui_matrix:
    name: UI tests (${{ matrix.browser }})
    needs: smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'ui' }}
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI tests
        run: |
          python -m pytest -m ui \
            --browser ${{ matrix.browser }} \
            --html=reports/ui-${{ matrix.browser }}-report.html \
            --self-contained-html \
            --junitxml=reports/ui-${{ matrix.browser }}-junit.xml

      - name: Upload UI artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.browser }}-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Collect test reports
    needs:
      - smoke
      - regression
      - ui_matrix
    if: ${{ always() && !cancelled() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download smoke artifacts
        uses: actions/download-artifact@v8
        with:
          name: smoke-test-artifacts
          path: collected-artifacts/smoke

      - name: Download regression artifacts
        if: ${{ needs.regression.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: regression-test-artifacts
          path: collected-artifacts/regression

      - name: Download Chromium artifacts
        if: ${{ needs.ui_matrix.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ui-chromium-test-artifacts
          path: collected-artifacts/ui/chromium

      - name: Download Firefox artifacts
        if: ${{ needs.ui_matrix.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ui-firefox-test-artifacts
          path: collected-artifacts/ui/firefox

      - name: Download WebKit artifacts
        if: ${{ needs.ui_matrix.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: ui-webkit-test-artifacts
          path: collected-artifacts/ui/webkit

      - name: Show collected files
        run: |
          find collected-artifacts -type f -print

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: combined-test-artifacts
          path: collected-artifacts/
          if-no-files-found: error
          retention-days: 14