name: QA tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run smoke tests
        run: |
          python -m pytest -m smoke \
            --html=reports/smoke-report.html \
            --self-contained-html \
            --junitxml=reports/smoke-junit.xml

      - name: Upload smoke artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Regression tests
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run regression tests
        run: |
          python -m pytest -m "not smoke" \
            --html=reports/regression-report.html \
            --self-contained-html \
            --junitxml=reports/regression-junit.xml

      - name: Upload regression artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: regression-test-artifacts
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14